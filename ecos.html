<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Simulation ECOS — Plateforme IFSI</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="content-column">
      <main>
        <h1>Simulation ECOS</h1>
        <p class="page-intro">
          Pas d'avatar IA ici — à jouer en binôme : un camarade ou un
          formateur incarne le patient à l'oral pendant que vous cochez la
          grille au fur et à mesure.
        </p>

        <div class="ecos-layout">
          <div class="ecos-list-col">
            <div id="scenario-list"></div>
          </div>
          <div class="ecos-detail-col">
            <div id="scenario-detail"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/error-reporter.js"></script>
  <script src="assets/student.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/data.js"></script>
  <script>
    renderNav('ecos');

    const ECOS_STORAGE_KEY = 'ifsi_ecos_history_v1';
    let selectedId = ECOS_SCENARIOS[0].id;

    function saveAttempt(entry) {
      let history = [];
      try { history = JSON.parse(localStorage.getItem(ECOS_STORAGE_KEY) || '[]'); } catch {}
      history.unshift(entry);
      try { localStorage.setItem(ECOS_STORAGE_KEY, JSON.stringify(history.slice(0, 50))); } catch {}
    }

    function renderList() {
      document.getElementById('scenario-list').innerHTML = ECOS_SCENARIOS.map((s) => `
        <div class="scenario-item ${s.id === selectedId ? 'selected' : ''}" data-id="${s.id}" tabindex="0">
          <span class="titre">${s.titre}</span>
          <span class="muted">${s.ctx}</span>
        </div>
      `).join('');

      document.querySelectorAll('.scenario-item').forEach((el) => {
        el.addEventListener('click', () => { selectedId = el.dataset.id; renderList(); renderDetail(); });
      });
    }

    function renderDetail() {
      const scenario = ECOS_SCENARIOS.find((s) => s.id === selectedId);
      const maxScore = scenario.eval.reduce((sum, e) => sum + e.pts, 0);
      const detail = document.getElementById('scenario-detail');

      detail.innerHTML = `
        <h2>${scenario.titre}</h2>

        <div class="detail-section">
          <div class="detail-label">Contexte</div>
          <p>${scenario.ctx}</p>
        </div>

        <div class="detail-section">
          <div class="detail-label">Rôle du patient (pour le camarade / formateur)</div>
          <p>${scenario.patient}</p>
        </div>

        <div class="detail-section">
          <div class="detail-label">Grille d'auto-évaluation</div>
          <div class="checklist" id="checklist"></div>
        </div>

        <div class="score-box">
          <span><span class="score-number" id="score-number">0</span> / ${maxScore}</span>
          <button class="primary" id="save-attempt-btn">Enregistrer cette tentative</button>
          <span class="save-confirm" id="save-confirm" style="display:none;">Enregistré ✓</span>
        </div>
      `;

      const checklistEl = document.getElementById('checklist');
      checklistEl.innerHTML = scenario.eval.map((e, i) => `
        <label>
          <input type="checkbox" data-pts="${e.pts}" id="crit-${i}">
          <span>${e.label}</span>
          <span class="pts-tag">${e.pts} pt${e.pts > 1 ? 's' : ''}</span>
        </label>
      `).join('');

      function updateScore() {
        const checked = checklistEl.querySelectorAll('input:checked');
        const total = Array.from(checked).reduce((sum, c) => sum + Number(c.dataset.pts), 0);
        document.getElementById('score-number').textContent = total;
        return total;
      }
      checklistEl.querySelectorAll('input').forEach((c) => c.addEventListener('change', updateScore));

      document.getElementById('save-attempt-btn').addEventListener('click', () => {
        const total = updateScore();
        saveAttempt({ scenarioId: scenario.id, titre: scenario.titre, score: total, maxScore, date: new Date().toISOString() });
        const confirm = document.getElementById('save-confirm');
        confirm.style.display = 'inline';
        setTimeout(() => { confirm.style.display = 'none'; }, 2200);
      });
    }

    renderList();
    renderDetail();
  </script>
  <script src="assets/nurse-avatar.js"></script>
  <script>initNurseAvatar('ecos');</script>
</body>
</html>
