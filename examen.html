<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Examen blanc IFSI : entraînement chronométré</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/v2.css"><link rel="stylesheet" data-ifsi-ux="header8" href="assets/ux.css?v=seo9">

<meta property="og:title" content="Examen blanc IFSI : entraînement chronométré"><meta property="og:description" content="Testez vos connaissances infirmières avec un examen blanc pédagogique, des corrections et des explications."><meta property="og:url" content="https://cosscoll.github.io/Berenice.ifsy/examen.html">
<meta name="twitter:card" content="summary">
</head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content-column"><main><div class="hero-v2"><h1>Examen blanc</h1><p>Questions chronométrées, sans correction immédiate. Les explications apparaissent à la fin.</p></div><div class="v2-card"><div id="setup" class="field-grid"><label>Questions<select id="count"><option value="10">10</option><option value="12">12</option><option value="20">20</option><option value="99">Toute la banque</option></select></label><label>Temps<select id="minutes"><option value="10">10 min</option><option value="15">15 min</option><option value="20">20 min</option></select></label></div><div class="v2-actions" id="setupActions"><button class="v2-button" id="start">Démarrer</button></div><div id="exam"></div></div></main></div></div><script src="assets/error-reporter.js"></script><script src="assets/student.js"></script><script src="assets/icons.js"></script><script src="assets/nav.js?v=seo9"></script><script src="assets/v2-core.js"></script><script src="assets/quiz-data.js?v=content9"></script><script src="assets/nurse-avatar.js"></script><script>
renderNav('examen');let qs=[],i=0,answers=[],remaining=0,timer=null;const area=document.getElementById('exam');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function clock(){const e=document.getElementById('timer');if(e)e.textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')}
function finish(){clearInterval(timer);const good=qs.reduce((n,q,j)=>n+(answers[j]===q.answer?1:0),0);saveQuizSession(good,qs.length);const score=Math.round(good/qs.length*100);area.innerHTML='<div class="done-state"><h1>'+score+'%</h1><p>'+good+'/'+qs.length+' bonnes réponses.</p></div>'+qs.map((q,j)=>'<article class="v2-card" style="margin:12px 0"><span class="pill">'+safeText(q.topic)+'</span><h2>'+safeText(q.question)+'</h2><p><strong>Ta réponse :</strong> '+(answers[j]==null?'Non répondue':safeText(q.choices[answers[j]]))+'</p><p><strong>Réponse attendue :</strong> '+safeText(q.choices[q.answer])+'</p><div class="explanation">'+safeText(q.explanation)+'</div></article>').join('')+'<button class="v2-button" onclick="location.reload()">Nouvel examen</button>'}
function render(){if(i>=qs.length)return finish();const q=qs[i];area.innerHTML='<div style="display:flex;justify-content:space-between"><span>Question '+(i+1)+'/'+qs.length+'</span><strong id="timer"></strong></div><div class="quiz-progress"><div style="width:'+Math.round(i/qs.length*100)+'%"></div></div><span class="pill">'+safeText(q.topic)+'</span><div class="quiz-question">'+safeText(q.question)+'</div><div class="quiz-choices">'+q.choices.map((c,j)=>'<button class="quiz-choice" data-i="'+j+'">'+safeText(c)+'</button>').join('')+'</div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{answers[i]=Number(b.dataset.i);i++;render()});clock()}
document.getElementById('start').onclick=()=>{const count=Math.min(Number(document.getElementById('count').value),QUIZ_BANK.length);qs=shuffle(QUIZ_BANK).slice(0,count);remaining=Number(document.getElementById('minutes').value)*60;document.getElementById('setup').style.display='none';document.getElementById('setupActions').style.display='none';render();timer=setInterval(()=>{remaining--;clock();if(remaining<=0)finish()},1000)};initNurseAvatar('examen');
</script></body></html>
