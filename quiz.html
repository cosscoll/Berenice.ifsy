<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiz — IFSI</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/v2.css"></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content-column"><main>
<section class="hero-v2"><h1>Quiz</h1><p>Choisis un thème, le nombre de questions, puis démarre. Plus besoin de parcourir un menu déroulant.</p></section>

<section id="quiz-home">
  <div class="explorer-toolbar"><input class="local-search" id="topic-search" type="search" placeholder="Rechercher un thème…"></div>
  <div class="topic-grid" id="topic-grid"></div>
  <div class="v2-card" style="margin-top:16px">
    <div class="field-grid">
      <label>Thème sélectionné<input id="selected-topic" value="Tous les thèmes" readonly></label>
      <label>Nombre de questions<select id="count-select"><option value="5">5 questions</option><option value="10">10 questions</option><option value="99">Toutes les questions disponibles</option></select></label>
    </div>
    <div class="v2-actions"><button class="v2-button" id="start-btn">Commencer le quiz</button><a class="v2-button secondary" href="examen.html">Mode examen blanc</a></div>
  </div>
</section>
<div class="v2-card" id="quiz-session" style="display:none"><div id="quiz-area"></div></div>
</main></div></div>

<script src="assets/error-reporter.js"></script><script src="assets/student.js"></script><script src="assets/icons.js"></script><script src="assets/nav.js"></script><script src="assets/v2-core.js"></script><script src="assets/quiz-data.js"></script><script src="assets/nurse-avatar.js"></script>
<script>
renderNav('quiz');
let selected='Tous les thèmes',session=[],cursor=0,correct=0,locked=false;
const search=document.getElementById('topic-search'),grid=document.getElementById('topic-grid'),selectedInput=document.getElementById('selected-topic');
const topics=[...new Set(QUIZ_BANK.map(q=>q.topic))].sort();
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function renderTopics(){
 const q=norm(search.value);const all=[{name:'Tous les thèmes',count:QUIZ_BANK.length},...topics.map(t=>({name:t,count:QUIZ_BANK.filter(q=>q.topic===t).length}))].filter(x=>!q||norm(x.name).includes(q));
 grid.innerHTML=all.map(x=>'<button class="topic-card '+(selected===x.name?'selected':'')+'" data-topic="'+safeText(x.name)+'" style="text-align:left;cursor:pointer"><span class="pill">'+x.count+' question'+(x.count>1?'s':'')+'</span><h3>'+safeText(x.name)+'</h3><div class="topic-meta">'+(x.name==='Tous les thèmes'?'Session mélangée':'Quiz ciblé')+'</div></button>').join('')||'<div class="empty-note">Aucun thème trouvé.</div>';
 document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{selected=b.dataset.topic;selectedInput.value=selected;renderTopics()});
}
function shuffled(list){return [...list].sort(()=>Math.random()-.5)}
function startQuiz(){
 const count=Number(document.getElementById('count-select').value),pool=selected==='Tous les thèmes'?QUIZ_BANK:QUIZ_BANK.filter(q=>q.topic===selected);
 session=shuffled(pool).slice(0,Math.min(count,pool.length));cursor=0;correct=0;locked=false;
 document.getElementById('quiz-home').style.display='none';document.getElementById('quiz-session').style.display='block';renderQuestion()
}
function renderQuestion(){
 const area=document.getElementById('quiz-area');
 if(cursor>=session.length){const pct=session.length?Math.round(correct/session.length*100):0;saveQuizSession(correct,session.length);area.innerHTML='<div class="done-state"><h1>'+pct+'%</h1><p>'+correct+' bonne'+(correct>1?'s':'')+' réponse'+(correct>1?'s':'')+' sur '+session.length+'.</p><div class="v2-actions" style="justify-content:center"><button class="v2-button" id="restart">Nouveau quiz</button><a class="v2-button secondary" href="progression.html">Voir ma progression</a></div></div>';document.getElementById('restart').onclick=()=>{document.getElementById('quiz-home').style.display='block';document.getElementById('quiz-session').style.display='none';area.innerHTML=''};return}
 locked=false;const q=session[cursor];area.innerHTML='<div class="quiz-progress"><div style="width:'+Math.round(cursor/session.length*100)+'%"></div></div><div style="display:flex;justify-content:space-between;gap:10px"><span class="pill">'+safeText(q.topic)+'</span><span class="muted">'+(cursor+1)+' / '+session.length+'</span></div><div class="quiz-question">'+safeText(q.question)+'</div><div class="quiz-choices">'+q.choices.map((c,i)=>'<button class="quiz-choice" data-i="'+i+'">'+safeText(c)+'</button>').join('')+'</div><div id="feedback"></div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))
}
function answer(index){if(locked)return;locked=true;const q=session[cursor];if(index===q.answer)correct++;document.querySelectorAll('.quiz-choice').forEach(b=>{const i=Number(b.dataset.i);b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===index&&i!==q.answer)b.classList.add('wrong')});document.getElementById('feedback').innerHTML='<div class="explanation"><strong>'+(index===q.answer?'Bonne réponse.':'À revoir.')+'</strong><br>'+safeText(q.explanation)+'</div><div class="v2-actions"><button class="v2-button" id="next">'+(cursor===session.length-1?'Voir le résultat':'Question suivante')+'</button></div>';document.getElementById('next').onclick=()=>{cursor++;renderQuestion()}}
search.addEventListener('input',renderTopics);document.getElementById('start-btn').onclick=startQuiz;
const requested=new URLSearchParams(location.search).get('topic');if(requested&&topics.includes(requested)){selected=requested;selectedInput.value=selected}renderTopics();initNurseAvatar('quiz');
</script></body></html>
