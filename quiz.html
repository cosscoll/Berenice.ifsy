<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiz IFSI : questions corrigées en soins infirmiers</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/v2.css"><link rel="stylesheet" data-ifsi-ux="header8" href="assets/ux.css?v=seo9">
  <meta name="description" content="Entraînez-vous avec des QCM infirmiers corrigés par thème : hygiène, médicaments, raisonnement clinique, éthique et plus encore.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://cosscoll.github.io/Berenice.ifsy/quiz.html">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IFSI Platform">
  <meta property="og:title" content="Quiz IFSI : questions corrigées en soins infirmiers">
  <meta property="og:description" content="Entraînez-vous avec des QCM infirmiers corrigés par thème : hygiène, médicaments, raisonnement clinique, éthique et plus encore.">
  <meta property="og:url" content="https://cosscoll.github.io/Berenice.ifsy/quiz.html">
  <meta name="twitter:card" content="summary">
</head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content-column"><main>
<section class="simple-page-head"><h1>Quiz</h1><p class="muted">Tu peux commencer tout de suite. Le choix du thème est optionnel.</p></section>

<section class="quick-start" id="quiz-home">
  <button class="primary-big" id="quick-start">Lancer 5 questions mélangées</button>
  <details class="disclosure" id="topic-disclosure">
    <summary>Je veux choisir un thème</summary>
    <div class="disclosure-body">
      <input class="chapter-search" id="topic-search" type="search" placeholder="Rechercher un thème…">
      <div class="theme-list" id="theme-list"></div>
    </div>
  </details>
  <details class="disclosure">
    <summary>Changer la longueur du quiz</summary>
    <div class="disclosure-body">
      <select id="count-select" style="width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff">
        <option value="5">5 questions</option><option value="10">10 questions</option><option value="99">Toutes les questions disponibles</option>
      </select>
    </div>
  </details>
  <p class="muted" id="selected-label" style="text-align:center;margin-top:14px">Thème : tous les thèmes</p>
  <button class="v2-button secondary" id="custom-start" style="display:none;width:100%;margin-top:8px">Démarrer ce quiz</button>
</section>

<section class="v2-card" id="quiz-session" style="display:none"><div id="quiz-area"></div></section>
</main></div></div>
<script src="assets/error-reporter.js"></script><script src="assets/student.js"></script><script src="assets/icons.js"></script><script src="assets/nav.js?v=course12"></script><script src="assets/v2-core.js"></script><script src="assets/quiz-data.js?v=course12"></script><script src="assets/nurse-avatar.js"></script>
<script>
renderNav('quiz');
let selected='Tous les thèmes',session=[],cursor=0,correct=0,locked=false;
const topics=[...new Set(QUIZ_BANK.map(q=>q.topic))].sort(),list=document.getElementById('theme-list'),search=document.getElementById('topic-search');
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function renderThemes(){const q=norm(search.value);const hits=topics.filter(t=>!q||norm(t).includes(q));list.innerHTML=hits.map(t=>'<button class="theme-row '+(selected===t?'selected':'')+'" data-topic="'+safeText(t)+'"><span>'+safeText(t)+'</span><span class="muted">'+QUIZ_BANK.filter(x=>x.topic===t).length+' q.</span></button>').join('')||'<div class="empty-note">Aucun thème.</div>';list.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{selected=b.dataset.topic;document.getElementById('selected-label').textContent='Thème : '+selected;document.getElementById('quick-start').textContent='Lancer 5 questions : '+selected;renderThemes()})}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(forceQuick){
 const count=forceQuick?5:Number(document.getElementById('count-select').value),pool=forceQuick||selected==='Tous les thèmes'?QUIZ_BANK:QUIZ_BANK.filter(q=>q.topic===selected);
 session=shuffled(pool).slice(0,Math.min(count,pool.length));cursor=0;correct=0;locked=false;document.getElementById('quiz-home').style.display='none';document.getElementById('quiz-session').style.display='block';renderQuestion()
}
function renderQuestion(){
 const area=document.getElementById('quiz-area');
 if(cursor>=session.length){const pct=session.length?Math.round(correct/session.length*100):0;saveQuizSession(correct,session.length);area.innerHTML='<div class="done-state"><h1>'+pct+'%</h1><p>'+correct+' / '+session.length+' bonnes réponses</p><div class="v2-actions" style="justify-content:center"><button class="v2-button" id="again">Refaire un quiz</button><a class="v2-button secondary" href="etudier.html">Réviser un chapitre</a></div></div>';document.getElementById('again').onclick=()=>location.reload();return}
 locked=false;const q=session[cursor];area.innerHTML='<div class="quiz-progress"><div style="width:'+Math.round(cursor/session.length*100)+'%"></div></div><div style="display:flex;justify-content:space-between"><span class="pill">'+safeText(q.topic)+'</span><span class="muted">'+(cursor+1)+' / '+session.length+'</span></div><div class="quiz-question">'+safeText(q.question)+'</div><div class="quiz-choices">'+q.choices.map((c,i)=>'<button class="quiz-choice" data-i="'+i+'">'+safeText(c)+'</button>').join('')+'</div><div id="feedback"></div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))
}
function answer(i){if(locked)return;locked=true;const q=session[cursor];if(i===q.answer)correct++;document.querySelectorAll('.quiz-choice').forEach(b=>{const n=Number(b.dataset.i);b.disabled=true;if(n===q.answer)b.classList.add('correct');if(n===i&&n!==q.answer)b.classList.add('wrong')});document.getElementById('feedback').innerHTML='<div class="explanation">'+safeText(q.explanation)+(q.sourceUrl?'<p class="muted small"><a href="'+q.sourceUrl+'" target="_blank" rel="noopener noreferrer">Lire la source</a></p>':'')+'</div><div class="v2-actions"><button class="v2-button" id="next">'+(cursor===session.length-1?'Voir le résultat':'Continuer')+'</button></div>';document.getElementById('next').onclick=()=>{cursor++;renderQuestion()}}
document.getElementById('quick-start').onclick=()=>startQuiz(selected==='Tous les thèmes');document.getElementById('custom-start').onclick=()=>startQuiz(false);search.addEventListener('input',renderThemes);
const requested=new URLSearchParams(location.search).get('topic');if(requested&&topics.includes(requested)){selected=requested;document.getElementById('selected-label').textContent='Thème : '+selected;document.getElementById('quick-start').textContent='Lancer 5 questions : '+selected;document.getElementById('topic-disclosure').open=true}
renderThemes();initNurseAvatar('quiz');
</script></body></html>
