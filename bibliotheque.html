</head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content-column"><main><div class="hero-v2"><h1>Bibliothèque & recherche</h1><p>Recherche dans la bibliothèque clinique, les fiches, les quiz et l’ancien catalogue UE.</p></div><div class="v2-card"><label>Rechercher<input id="search" type="search" placeholder="Ex. consentement, hygiène, Glasgow…"></label><div id="results" style="margin-top:18px"></div></div></main></div></div><script src="assets/error-reporter.js"></script><script src="assets/student.js"></script><script src="assets/icons.js"></script><script src="assets/nav.js?v=cases13"></script><script src="assets/data.js"></script><script src="assets/v2-core.js"></script><script src="assets/quiz-data.js?v=course12"></script><script src="assets/clinical-library.js"></script><script src="assets/nurse-avatar.js"></script><script>
renderNav('bibliotheque');const input=document.getElementById('search'),out=document.getElementById('results');
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function indexAll(){const a=[];CLINICAL_LIBRARY.forEach(x=>a.push({type:'Bibliothèque',title:x.title,text:[x.summary,...x.keyPoints,...x.tags].join(' '),body:'<p>'+safeText(x.summary)+'</p><ul>'+x.keyPoints.map(k=>'<li>'+safeText(k)+'</li>').join('')+'</ul><p class="muted small">Source : '+(x.sourceUrl?'<a target="_blank" rel="noopener" href="'+x.sourceUrl+'">'+safeText(x.source)+'</a>':safeText(x.source))+' • Vérifié '+x.verified+'</p>'}));FSRS_DECK.forEach(x=>a.push({type:'Fiche',title:x.concept,text:x.front+' '+x.back+' '+x.ue,body:'<p><strong>Question :</strong> '+safeText(x.front)+'</p><p>'+safeText(x.back)+'</p>'}));QUIZ_BANK.forEach(x=>a.push({type:'Quiz',title:x.topic,text:x.question+' '+x.explanation,body:'<p>'+safeText(x.question)+'</p><p class="muted">'+safeText(x.explanation)+'</p>'}));return a}
const INDEX=indexAll();function render(){const q=norm(input.value.trim()),hits=(q?INDEX.filter(x=>norm(x.title+' '+x.text).includes(q)):INDEX.filter(x=>x.type==='Bibliothèque')).slice(0,40);out.innerHTML=hits.length?'<p class="muted">'+hits.length+' résultat'+(hits.length>1?'s':'')+'</p>'+hits.map(x=>'<article class="v2-card" style="margin:10px 0"><span class="pill">'+x.type+'</span><h2>'+safeText(x.title)+'</h2>'+x.body+'</article>').join(''):'<p class="muted">Aucun résultat.</p>'}input.addEventListener('input',render);render();initNurseAvatar('bibliotheque');
</script></body></html>
