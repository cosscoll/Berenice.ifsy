<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Apprentissage guidé — IFSI</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/v2.css"></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content-column"><main>
<div class="hero-v2"><h1>Apprentissage guidé</h1><p>Découvrir → comprendre → vérifier → appliquer → mémoriser. Chaque module est court et conserve ta progression dans ce navigateur.</p></div>
<div class="dashboard-grid"><section class="v2-card"><h2>Modules</h2><div id="module-list" class="daily-list"></div></section><section class="v2-card" id="lesson"><h2>Choisis un module</h2><p class="muted">Le parcours apparaîtra ici.</p></section></div>
</main></div></div>
<script src="assets/error-reporter.js"></script><script src="assets/student.js"></script><script src="assets/icons.js"></script><script src="assets/nav.js"></script><script src="assets/v2-core.js"></script><script src="assets/learning-data.js"></script><script src="assets/nurse-avatar.js"></script>
<script>
renderNav('apprentissage');
const KEY='ifsi_learning_progress_v2'; let active=LEARNING_MODULES[0].id;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}} function save(v){localStorage.setItem(KEY,JSON.stringify(v))}
function renderList(){const p=load();document.getElementById('module-list').innerHTML=LEARNING_MODULES.map(m=>{const done=(p[m.id]||[]).length;return `<button class="quiz-choice" data-module="${m.id}"><strong>${safeText(m.title)}</strong><br><span class="muted small">Domaine ${m.domain} • ${done}/${m.steps.length} étapes</span></button>`}).join('');document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{active=b.dataset.module;renderLesson();renderList()})}
function renderLesson(){const m=LEARNING_MODULES.find(x=>x.id===active),p=load(),done=new Set(p[m.id]||[]);document.getElementById('lesson').innerHTML=`<span class="pill">Domaine ${m.domain}</span><h2>${safeText(m.title)}</h2><p class="muted">${safeText(m.level)} • vérifié le ${m.verified}</p><div class="daily-list">${m.steps.map((s,i)=>`<div class="daily-item"><span class="step">${i+1}</span><div style="flex:1"><strong>${safeText(s.phase)} — ${safeText(s.title)}</strong><div style="margin-top:6px">${safeText(s.body)}</div><label style="display:flex;gap:8px;margin-top:10px;align-items:center"><input type="checkbox" data-step="${i}" ${done.has(i)?'checked':''}> étape maîtrisée</label></div></div>`).join('')}</div><p class="muted small" style="margin-top:14px">Source : ${m.sourceUrl?`<a href="${m.sourceUrl}" target="_blank" rel="noopener">${safeText(m.source)}</a>`:safeText(m.source)}</p>`;document.querySelectorAll('[data-step]').forEach(c=>c.onchange=()=>{const state=load();const s=new Set(state[m.id]||[]);c.checked?s.add(Number(c.dataset.step)):s.delete(Number(c.dataset.step));state[m.id]=[...s];save(state);renderList()})}
renderList();renderLesson();initNurseAvatar('apprentissage');
</script></body></html>
