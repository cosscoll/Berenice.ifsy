<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Apprentissage guidé IFSI : modules par étapes</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/v2.css"><link rel="stylesheet" data-ifsi-ux="header8" href="assets/ux.css?v=pathway14">
<meta name="description" content="Apprenez des notions infirmières par étapes courtes : découvrir, comprendre, appliquer et mémoriser.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://cosscoll.github.io/Berenice.ifsy/apprentissage.html">
<meta property="og:type" content="website"><meta property="og:locale" content="fr_FR"><meta property="og:site_name" content="IFSI Platform">
<meta property="og:title" content="Apprentissage guidé IFSI : modules par étapes"><meta property="og:description" content="Apprenez des notions infirmières par étapes courtes : découvrir, comprendre, appliquer et mémoriser."><meta property="og:url" content="https://cosscoll.github.io/Berenice.ifsy/apprentissage.html">
<meta name="twitter:card" content="summary">
</head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content-column"><main>
<section class="hero-v2"><h1>Apprentissage guidé</h1><p>Découvrir → comprendre → vérifier → appliquer → mémoriser. Choisis un module ou arrive directement depuis un chapitre.</p></section>
<div class="dashboard-grid">
  <section class="v2-card"><div class="explorer-toolbar"><input class="local-search" id="module-search" type="search" placeholder="Rechercher un module…"></div><div id="module-list" class="daily-list"></div></section>
  <section class="v2-card" id="lesson"><h2>Choisis un module</h2></section>
</div>
</main></div></div>
<script src="assets/error-reporter.js"></script><script src="assets/student.js"></script><script src="assets/icons.js"></script><script src="assets/nav.js?v=pathway14"></script><script src="assets/v2-core.js"></script><script src="assets/learning-data.js?v=content9"></script><script src="assets/nurse-avatar.js"></script>
<script>
renderNav('apprentissage');
const KEY='ifsi_learning_progress_v2',requested=new URLSearchParams(location.search).get('module');let active=LEARNING_MODULES.some(m=>m.id===requested)?requested:LEARNING_MODULES[0].id;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}function save(v){localStorage.setItem(KEY,JSON.stringify(v))}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function renderList(){const p=load(),q=norm(document.getElementById('module-search').value),mods=LEARNING_MODULES.filter(m=>!q||norm(m.title+' '+m.domain).includes(q));document.getElementById('module-list').innerHTML=mods.map(m=>{const done=(p[m.id]||[]).length;return '<button class="quiz-choice '+(m.id===active?'selected':'')+'" data-module="'+m.id+'"><strong>'+safeText(m.title)+'</strong><br><span class="muted small">Domaine '+m.domain+' • '+done+'/'+m.steps.length+' étapes</span></button>'}).join('')||'<div class="empty-note">Aucun module trouvé.</div>';document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{active=b.dataset.module;history.replaceState(null,'','apprentissage.html?module='+encodeURIComponent(active));renderLesson();renderList()})}
function renderLesson(){const m=LEARNING_MODULES.find(x=>x.id===active),p=load(),done=new Set(p[m.id]||[]);document.getElementById('lesson').innerHTML='<span class="pill">Domaine '+m.domain+'</span><h2>'+safeText(m.title)+'</h2><p class="muted">Vérifié le '+m.verified+'</p><div class="daily-list">'+m.steps.map((s,i)=>'<div class="daily-item"><span class="step">'+(i+1)+'</span><div style="flex:1"><strong>'+safeText(s.phase)+' — '+safeText(s.title)+'</strong><div style="margin-top:6px">'+safeText(s.body)+'</div><label style="display:flex;gap:8px;margin-top:10px;align-items:center"><input type="checkbox" data-step="'+i+'" '+(done.has(i)?'checked':'')+'> étape maîtrisée</label></div></div>').join('')+'</div><p class="muted small" style="margin-top:14px">Source : '+(m.sourceUrl?'<a href="'+m.sourceUrl+'" target="_blank" rel="noopener">'+safeText(m.source)+'</a>':safeText(m.source))+'</p>';document.querySelectorAll('[data-step]').forEach(c=>c.onchange=()=>{const state=load(),s=new Set(state[m.id]||[]);c.checked?s.add(Number(c.dataset.step)):s.delete(Number(c.dataset.step));state[m.id]=[...s];save(state);renderList()})}
document.getElementById('module-search').addEventListener('input',renderList);renderList();renderLesson();initNurseAvatar('apprentissage');
</script></body></html>
