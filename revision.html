<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Révision espacée IFSI : mes fiches du jour</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/v2.css"><link rel="stylesheet" data-ifsi-ux="header8" href="assets/ux.css?v=final18">
<meta name="description" content="Révisez avec des fiches en répétition espacée, des corrections et des cartes mentales.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://cosscoll.github.io/Berenice.ifsy/revision.html">
<meta property="og:type" content="website"><meta property="og:locale" content="fr_FR"><meta property="og:site_name" content="IFSI Platform">
<meta property="og:title" content="Révision espacée IFSI : mes fiches du jour"><meta property="og:description" content="Révisez avec des fiches en répétition espacée, des corrections et des cartes mentales."><meta property="og:url" content="https://cosscoll.github.io/Berenice.ifsy/revision.html">
<meta name="twitter:card" content="summary">
</head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content-column"><main>
<section class="simple-page-head">
  <h1 id="session-title">Révision du jour</h1>
  <p class="muted" id="session-subtitle">On te montre directement la prochaine carte.</p>
  <a class="subtle-link" href="etudier.html">Changer de chapitre</a>
</section>
<div id="revision-area"></div>
</main></div></div>
<script src="assets/error-reporter.js"></script><script src="assets/icons.js"></script><script src="assets/nav.js?v=final18"></script><script src="assets/student.js"></script><script src="assets/data.js?v=medical10"></script><script src="assets/fsrs.js"></script><script src="assets/simple-mindmap.js"></script><script src="assets/nurse-avatar.js"></script>
<script>
renderNav('revision');
const requestedUe=new URLSearchParams(location.search).get('ue');
let queue=requestedUe?FSRS_DECK.filter(c=>c.ue===requestedUe):getDueCards(FSRS_DECK);
const total=queue.length;let revealed=false;const area=document.getElementById('revision-area');
function ueTitle(code){for(const b of UE_CATALOGUE){const f=b.ues.find(u=>u.id===code);if(f)return f.titre}return ''}
if(requestedUe){
 document.getElementById('session-title').textContent='UE '+requestedUe+' — '+ueTitle(requestedUe);
 document.getElementById('session-subtitle').textContent=total+' fiche'+(total>1?'s':'')+' dans ce chapitre.';
}
function render(){
 if(!queue.length){
  area.innerHTML='<div class="done-state"><h1>'+(total?'Session terminée':'Rien à réviser ici')+'</h1><p class="muted">'+(total?'Tu as parcouru toutes les fiches de cette session.':'Aucune fiche disponible pour cette sélection.')+'</p><a class="v2-button" href="etudier.html">Choisir un chapitre</a></div>';return
 }
 const c=queue[0],done=total-queue.length,pct=total?Math.round(done/total*100):0;
 area.innerHTML='<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><p class="progress-label">'+done+' / '+total+'</p><div class="study-card"><span class="ue-tag">UE '+c.ue+' — '+c.concept+'</span><p class="front">'+c.front+'</p>'+
 (revealed?'<div class="back-reveal">'+c.back+'</div>'+(c.sourceUrl?'<p class="muted small"><a href="'+c.sourceUrl+'" target="_blank" rel="noopener noreferrer">Consulter la source</a></p>':'')+'<div id="mindmap-wrap" style="text-align:left;margin-top:18px"></div><div class="rating-bar"><button class="rate-again" data-rating="1">À revoir</button><button class="rate-hard" data-rating="2">Difficile</button><button class="rate-good" data-rating="3">Bien</button><button class="rate-easy" data-rating="4">Facile</button></div>':'<button class="primary reveal-btn" id="reveal">Voir la réponse</button>')+'</div>';
 if(revealed){try{renderMindmapInto(document.getElementById('mindmap-wrap'),c.md,{height:300,title:c.concept})}catch(e){}document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>rate(c.id,Number(b.dataset.rating)))}else document.getElementById('reveal').onclick=()=>{revealed=true;render()}
}
function rate(id,r){reviewCard(id,r);queue.shift();revealed=false;render()}
document.addEventListener('keydown',e=>{if(!revealed&&e.code==='Space'&&queue.length){e.preventDefault();revealed=true;render()}else if(revealed&&['1','2','3','4'].includes(e.key)&&queue.length)rate(queue[0].id,Number(e.key))});
render();initNurseAvatar('revision');
</script></body></html>
