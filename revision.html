<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Révision FSRS — Plateforme IFSI</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">IFSI Platform</div>
      <nav>
        <a href="index.html">Tableau de bord</a>
        <a href="ue.html">Catalogue UE</a>
        <a href="revision.html" class="active">Révision (FSRS)</a>
        <a href="anatomie.html">Anatomie 3D</a>
        <a href="ecos.html">Simulation ECOS</a>
      </nav>
    </aside>
    <div style="flex:1; display:flex; flex-direction:column;">
      <header class="topbar">
        <strong>Plateforme e-learning IFSI</strong>
        <span class="badge">— version statique, sans backend</span>
      </header>
      <main>
        <h1>Révision (répétition espacée)</h1>
        <p id="due-count" class="muted"></p>
        <div id="revision-area"></div>
      </main>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/fsrs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.18"></script>
  <script>
    function render() {
      const due = getDueCards(FSRS_DECK);
      const countEl = document.getElementById('due-count');
      const area = document.getElementById('revision-area');

      if (due.length === 0) {
        countEl.textContent = '';
        area.innerHTML = '<h2>Aucune carte à réviser pour le moment 🎉</h2>' +
          '<p class="muted">Revenez demain, ou réinitialisez la démo ci-dessous.</p>' +
          '<button onclick="resetDemo()">Réinitialiser les cartes de démonstration</button>';
        return;
      }

      countEl.textContent = due.length + ' carte(s) à réviser';
      const current = due[0];

      area.innerHTML = `
        <div class="card">
          <p style="font-size:12px; color:#8cf;">UE${current.ue} — ${current.concept}</p>
          <p style="font-size:18px;">${current.front}</p>
          <hr style="border-color:#333;">
          <p style="color:#9aa;">${current.back}</p>
          <div class="markmap"><script type="text/template">${current.md}</` + `script></div>
        </div>
        <div style="margin-top:16px; display:flex; gap:8px;">
          <button onclick="rate('${current.id}', 1)">Again</button>
          <button onclick="rate('${current.id}', 2)">Hard</button>
          <button onclick="rate('${current.id}', 3)">Good</button>
          <button onclick="rate('${current.id}', 4)">Easy</button>
        </div>
      `;

      // Re-déclenche le rendu Markmap pour le nouveau bloc injecté dans le DOM.
      if (window.markmap && window.markmap.autoLoader) {
        window.markmap.autoLoader.renderAll();
      }
    }

    function rate(cardId, rating) {
      reviewCard(cardId, rating);
      render();
    }

    function resetDemo() {
      localStorage.removeItem(FSRS_STORAGE_KEY);
      render();
    }

    render();
  </script>
</body>
</html>
