<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Progression — IFSI</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/v2.css"><link rel="stylesheet" data-ifsi-ux="header8" href="assets/ux.css?v=header8"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content-column"><main><div class="hero-v2"><h1>Ma progression</h1><p>Vue locale des révisions, quiz, ECOS et objectifs de stage.</p></div><div class="metric-grid" id="metrics"></div><div class="dashboard-grid"><section class="v2-card"><h2>Révision espacée</h2><div id="revisionStats"></div></section><section class="v2-card"><h2>Quiz</h2><div id="quizStats"></div></section><section class="v2-card"><h2>ECOS</h2><div id="ecosStats"></div></section><section class="v2-card"><h2>Stage</h2><div id="stageStats"></div></section></div></main></div></div><script src="assets/error-reporter.js"></script><script src="assets/student.js"></script><script src="assets/icons.js"></script><script src="assets/nav.js?v=header8"></script><script src="assets/data.js"></script><script src="assets/fsrs.js"></script><script src="assets/v2-core.js"></script><script src="assets/progression.js"></script><script src="assets/nurse-avatar.js"></script><script>
renderNav('progression');const r=getRevisionStats(FSRS_DECK),q=getQuizStats(),e=getEcosStats(),s=getStageStats(),pct=(a,b)=>b?Math.round(a/b*100):0;
document.getElementById('metrics').innerHTML='<div class="metric"><strong>'+r.seen+'/'+r.total+'</strong><span>fiches déjà vues</span></div><div class="metric"><strong>'+(q.lastScore===null?'—':q.lastScore+'%')+'</strong><span>dernier quiz</span></div><div class="metric"><strong>'+(e.average===null?'—':e.average+'%')+'</strong><span>moyenne ECOS</span></div><div class="metric"><strong>'+s.done+'/'+s.total+'</strong><span>objectifs stage réalisés</span></div>';
document.getElementById('revisionStats').innerHTML='<p><strong>'+r.solid+'</strong> consolidées • <strong>'+r.fragile+'</strong> à renforcer.</p><div class="progress-track"><div class="progress-fill" style="width:'+pct(r.solid,r.total)+'%"></div></div>';
document.getElementById('quizStats').innerHTML='<p><strong>'+q.sessions+'</strong> session(s) • '+(q.attempts?Math.round(q.correct/q.attempts*100):0)+'% correct au total.</p>';
document.getElementById('ecosStats').innerHTML='<p><strong>'+e.attempts+'</strong> tentative(s)'+(e.average===null?'':' • moyenne '+e.average+'%')+'.</p>';
document.getElementById('stageStats').innerHTML='<p><strong>'+s.done+'/'+s.total+'</strong> objectifs cochés • <strong>'+s.notes+'</strong> notes de terrain.</p><a class="v2-button secondary" href="stage.html">Ouvrir mon stage</a>';initNurseAvatar('progression');
</script></body></html>
