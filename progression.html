</head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content-column"><main><div class="hero-v2"><h1>Ma progression</h1><p>Vue locale des révisions, quiz, ECOS et objectifs de stage.</p></div><div class="metric-grid" id="metrics"></div><div class="dashboard-grid"><section class="v2-card"><h2>Révision espacée</h2><div id="revisionStats"></div></section><section class="v2-card"><h2>Quiz</h2><div id="quizStats"></div></section><section class="v2-card"><h2>ECOS</h2><div id="ecosStats"></div></section><section class="v2-card"><h2>Stage</h2><div id="stageStats"></div></section><section class="v2-card"><h2>Mes cours</h2><div id="courseStats"></div></section><section class="v2-card"><h2>Situations pratiques</h2><div id="situationStats"></div></section></div></main></div></div><script src="assets/error-reporter.js"></script><script src="assets/student.js"></script><script src="assets/icons.js"></script><script src="assets/nav.js?v=cases13"></script><script src="assets/data.js"></script><script src="assets/fsrs.js"></script><script src="assets/v2-core.js"></script><script src="assets/progression.js?v=cases13"></script><script src="assets/cases-data.js?v=cases13"></script><script src="assets/courses-data.js?v=course12"></script><script src="assets/nurse-avatar.js"></script><script>
renderNav('progression');const r=getRevisionStats(FSRS_DECK),q=getQuizStats(),e=getEcosStats(),s=getStageStats(),c=getCourseStats(IFSI_COURSES),cases=getSituationStats(window.IFSI_CASES),pct=(a,b)=>b?Math.round(a/b*100):0;

document.getElementById('revisionStats').innerHTML='<p><strong>'+r.solid+'</strong> consolidées • <strong>'+r.fragile+'</strong> à renforcer.</p><div class="progress-track"><div class="progress-fill" style="width:'+pct(r.solid,r.total)+'%"></div></div>';
document.getElementById('quizStats').innerHTML='<p><strong>'+q.sessions+'</strong> session(s) • '+(q.attempts?Math.round(q.correct/q.attempts*100):0)+'% correct au total.</p>';
document.getElementById('ecosStats').innerHTML='<p><strong>'+e.attempts+'</strong> tentative(s)'+(e.average===null?'':' • moyenne '+e.average+'%')+'.</p>';
document.getElementById('stageStats').innerHTML='<p><strong>'+s.done+'/'+s.total+'</strong> objectifs cochés • <strong>'+s.notes+'</strong> notes de terrain.</p><a class="v2-button secondary" href="stage.html">Ouvrir mon stage</a>';document.getElementById('situationStats').innerHTML='<p><strong>'+cases.completed+'/'+cases.total+'</strong> situations réalisées • '+cases.attempts+' tentatives • '+(cases.average===null?'aucun score':cases.average+'% au dernier essai par situation')+'.</p><a class="v2-button secondary" href="situations.html">S’entraîner sur des situations</a>';
document.getElementById('courseStats').innerHTML='<p><strong>'+c.completed+'/'+c.total+'</strong> cours terminés • <strong>'+c.started+'</strong> commencés.</p><a class="v2-button secondary" href="cours.html">Parcourir les cours</a>';initNurseAvatar('progression');
