<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalogue UE — Plateforme IFSI</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">IFSI Platform</div>
      <nav>
        <a href="index.html">Tableau de bord</a>
        <a href="ue.html" class="active">Catalogue UE</a>
        <a href="revision.html">Révision (FSRS)</a>
        <a href="anatomie.html">Anatomie 3D</a>
        <a href="ecos.html">Simulation ECOS</a>
      </nav>
    </aside>
    <div style="flex:1; display:flex; flex-direction:column;">
      <header class="topbar">
        <strong>Plateforme e-learning IFSI</strong>
        <span class="badge">— version statique, sans backend</span>
      </header>
      <main>
        <h1>Catalogue des UE</h1>
        <p class="muted">
          Référentiel infirmier 2026 (3 ans, 4620h). Les titres sont saisis ;
          le contenu détaillé de cours reste à rédiger UE par UE.
        </p>
        <div id="ue-container"></div>
      </main>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script>
    const container = document.getElementById('ue-container');
    UE_CATALOGUE.forEach((bloc) => {
      const section = document.createElement('div');
      section.className = 'ue-bloc';
      const list = bloc.ues.map((ue) =>
        `<li><span class="ue-code">UE${ue.id}</span>${ue.titre}</li>`
      ).join('');
      section.innerHTML = `<h2>${bloc.bloc} — ${bloc.titreBloc}</h2><ul class="ue-list">${list}</ul>`;
      container.appendChild(section);
    });
  </script>
</body>
</html>
